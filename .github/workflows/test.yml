name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'app/**'
      - 'supabase/migrations/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Decode Firebase config
        working-directory: app
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 -d > lib/firebase_options.dart

      - name: Download dictionary database
        working-directory: app
        run: curl -fSL -o assets/oald10.db "${{ secrets.R2_BASE_URL }}/db/oald10.db"

      - name: Run all tests
        working-directory: app
        run: flutter test

      - name: Stop Supabase
        if: always()
        run: supabase stop
